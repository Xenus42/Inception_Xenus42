services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: inception-mariadb:bookworm
    env_file:
      - .env
    environment:
      MYSQL_DATABASE_FILE: /run/secrets/mysql_wp_database
      MYSQL_USER_FILE: /run/secrets/mysql_wp_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_wp_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - mysql_wp_database
      - mysql_wp_user
      - mysql_wp_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  wordpress:
    build:
      context: ./requirements/wordpress
    image: inception-wordpress:bookworm
    env_file:
      - .env
    environment:
      MYSQL_DATABASE_FILE: /run/secrets/mysql_wp_database
      MYSQL_USER_FILE: /run/secrets/mysql_wp_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_wp_password
      WP_ADMIN_NAME_FILE: /run/secrets/wp_admin_name
      WP_ADMIN_PASS_FILE: /run/secrets/wp_admin_pass
      WP_ADMIN_EMAIL_FILE: /run/secrets/wp_admin_email
      WP_USER_NAME_FILE: /run/secrets/wp_user_name
      WP_USER_PASS_FILE: /run/secrets/wp_user_pass
      WP_USER_EMAIL_FILE: /run/secrets/wp_user_email
    secrets:
      - mysql_wp_database
      - mysql_wp_user
      - mysql_wp_password
      - wp_admin_name
      - wp_admin_pass
      - wp_admin_email
      - wp_user_name
      - wp_user_pass
      - wp_user_email
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_wp_database:
    file: ../secrets/mysql_wp_database.txt
  mysql_wp_user:
    file: ../secrets/mysql_wp_user.txt
  mysql_wp_password:
    file: ../secrets/mysql_wp_password.txt
  wp_admin_name:
    file: ../secrets/wp_admin_name.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_admin_email:
    file: ../secrets/wp_admin_email.txt
  wp_user_name:
    file: ../secrets/wp_user_name.txt
  wp_user_pass:
    file: ../secrets/wp_user_pass.txt
  wp_user_email:
    file: ../secrets/wp_user_email.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lebroue/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lebroue/data/wordpress

networks:
  inception:
    driver: bridge