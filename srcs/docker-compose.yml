services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: inception-mariadb:bookworm
    secrets:
      - mysql_root_password
      - mysql_wp_database
      - mysql_wp_user
      - mysql_wp_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=socket --silent 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  wordpress:
    build:
      context: ./requirements/wordpress
    image: inception-wordpress:bookworm
    environment:
      LOCAL: ${LOCAL}
      WP_DB_HOST: ${WP_DB_HOST}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
    secrets:
      - mysql_wp_database
      - mysql_wp_user
      - mysql_wp_password
      - wp_admin_name
      - wp_admin_pass
      - wp_admin_email
      - wp_user_name
      - wp_user_pass
      - wp_user_email
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./requirements/nginx
    image: inception-nginx:bookworm
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_wp_database:
    file: ../secrets/mysql_wp_database.txt
  mysql_wp_user:
    file: ../secrets/mysql_wp_user.txt
  mysql_wp_password:
    file: ../secrets/mysql_wp_password.txt
  wp_admin_name:
    file: ../secrets/wp_admin_name.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_admin_email:
    file: ../secrets/wp_admin_email.txt
  wp_user_name:
    file: ../secrets/wp_user_name.txt
  wp_user_pass:
    file: ../secrets/wp_user_pass.txt
  wp_user_email:
    file: ../secrets/wp_user_email.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lebroue/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lebroue/data/wordpress

networks:
  inception:
    driver: bridge
